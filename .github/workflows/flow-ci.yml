name: Flow CI

# Flow fork: a small check on GitHub's own runners. T3 Code's CI ran on Blacksmith runners this
# repository does not have, so its jobs waited for a runner forever; those workflows are removed
# (scripts/fork/prune-upstream-workflows.sh). Releases have their own flow-*-release workflows.

on:
  pull_request:
  # main only ever receives develop, which was checked when it was pushed.
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Only fork workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/workflows
            scripts/fork
      - name: Reject upstream workflows
        run: scripts/fork/prune-upstream-workflows.sh --check

  changed:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      files: ${{ steps.compare.outputs.files }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          sparse-checkout: .github
      # A merge whose files equal its first parent's, such as a back-merge after a release,
      # has nothing new to check.
      - name: Compare with the first parent
        id: compare
        run: |
          if [ "${{ github.event_name }}" = push ] && git rev-parse -q --verify HEAD^1 > /dev/null &&
            [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^1^{tree}')" ]; then
            echo "Same files as the first parent; skipping the check."
            echo "files=same" >> "$GITHUB_OUTPUT"
          else
            echo "files=changed" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Format, lint, types and quick tests
    needs: changed
    if: needs.changed.outputs.files == 'changed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Format
        run: vp fmt --check

      - name: Lint
        run: vp lint --report-unused-disable-directives

      - name: Typecheck server and web
        run: |
          (cd apps/server && npx tsc --noEmit -p .)
          (cd apps/web && npx tsc --noEmit -p .)

      - name: Quick tests
        run: |
          vp run --filter @t3tools/contracts --filter @t3tools/shared --filter @t3tools/client-runtime test
          (cd apps/web && vp test run --project unit)
